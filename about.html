<script>
(function(){
  const btn = document.getElementById('shareBtn');
  const toast = document.getElementById('shareToast');

  function showToast(message){
    toast.textContent = message;
    toast.classList.add('show');
    clearTimeout(window.__shareToastTimer);
    window.__shareToastTimer = setTimeout(() => {
      toast.classList.remove('show');
    }, 1800);
  }

  btn.addEventListener('click', async () => {
    const shareData = {
      title: '小太陽 & 小月亮 的成長日記',
      text: '一起看看小太陽 & 小月亮的成長日記 ♡',
      url: window.location.href
    };

    try{
      if(navigator.share){
        await navigator.share(shareData);
      }else if(navigator.clipboard){
        await navigator.clipboard.writeText(window.location.href);
        showToast('連結已複製');
      }else{
        const input = document.createElement('input');
        input.value = window.location.href;
        document.body.appendChild(input);
        input.select();
        document.execCommand('copy');
        input.remove();
        showToast('連結已複製');
      }
    }catch(err){
      if(err && err.name !== 'AbortError'){
        showToast('可複製網址後分享');
      }
    }
  });
})();
</script>
<script>
(function(){
  const likeBtn = document.getElementById('likeBtn');
  const likeCount = document.getElementById('likeCount');
  const commentBtn = document.getElementById('commentBtn');
  const panel = document.getElementById('commentPanel');
  const input = document.getElementById('commentInput');
  const cancelBtn = document.getElementById('cancelComment');
  const submitBtn = document.getElementById('submitComment');
  const list = document.getElementById('commentsList');

  let liked = localStorage.getItem('kidsSiteLiked') === '1';
  let count = Number(localStorage.getItem('kidsSiteLikeCount') || 0);
  let comments = [];
  try{
    comments = JSON.parse(localStorage.getItem('kidsSiteComments') || '[]');
  }catch(e){ comments = []; }

  function renderLike(){
    likeCount.textContent = count;
    likeBtn.classList.toggle('liked', liked);
    const icon = likeBtn.querySelector('span:first-child');
    if(icon) icon.textContent = liked ? '♥' : '♡';
  }

  function renderComments(){
    list.innerHTML = '';
    comments.slice().reverse().forEach(item => {
      const card = document.createElement('div');
      card.className = 'comment-item';

      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = item.time;

      const text = document.createElement('div');
      text.className = 'text';
      text.textContent = item.text;

      card.appendChild(meta);
      card.appendChild(text);
      list.appendChild(card);
    });
  }

  likeBtn.addEventListener('click', () => {
    liked = !liked;
    count = Math.max(0, count + (liked ? 1 : -1));
    localStorage.setItem('kidsSiteLiked', liked ? '1' : '0');
    localStorage.setItem('kidsSiteLikeCount', String(count));
    renderLike();
  });

  function openPanel(){
    panel.classList.add('open');
    panel.setAttribute('aria-hidden','false');
    renderComments();
    setTimeout(() => input.focus(), 100);
  }
  function closePanel(){
    panel.classList.remove('open');
    panel.setAttribute('aria-hidden','true');
  }

  commentBtn.addEventListener('click', openPanel);
  cancelBtn.addEventListener('click', closePanel);
  panel.addEventListener('click', e => {
    if(e.target === panel) closePanel();
  });

  submitBtn.addEventListener('click', () => {
    const text = input.value.trim();
    if(!text) return;
    comments.push({
      text,
      time:new Date().toLocaleString('zh-TW', {
        year:'numeric', month:'2-digit', day:'2-digit',
        hour:'2-digit', minute:'2-digit'
      })
    });
    localStorage.setItem('kidsSiteComments', JSON.stringify(comments));
    input.value = '';
    renderComments();
  });

  renderLike();
})();
</script>
